version: "3.9"

services:
  gateway-dev:
    build: .
    container_name: nexus-dev
    command:
      - uv
      - run
      - uvicorn
      - server:app
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --reload
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./:/app
      - gateway-dev-data:/data
    environment:
      GATEWAY_STATE_DB_PATH: "/data/gateway.db"
      LOG_FILE: "/data/server.log"

volumes:
  gateway-dev-data:
